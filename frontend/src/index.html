<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Backgrid | Industrial Pop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">&#9776;</button>
            <div class="brand-block">
                <div class="brand-name">BACKGRID</div>
                <div class="brand-version">v2.0.0</div>
            </div>
        </div>
        <div class="header-right">
            <div id="healthIndicator"></div>
            <div id="freshnessIndicator"></div>
            <button class="btn-import" id="importStrategyBtn">IMPORT</button>
            <button class="btn-theme" id="themeToggle">☀</button>
            <button class="btn-help" id="helpBtn">?</button>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <aside class="config-panel">
            <form id="form" class="config-form">
                <div id="universeSetup"></div>
                <div id="universeValidation"></div>
                <div id="strategySection"></div>
                <div id="presetSection"></div>
                <div id="executionSection"></div>
                <button type="submit" id="submitBtn" class="run-btn">INITIALIZE BACKTEST</button>
                <div id="historySection"></div>
            </form>
        </aside>

        <main class="results-stage" id="results"></main>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
